version: '3.9'

services:

  app:

    build: .

    container_name: libtrack_api

    ports:
      - "8000:8000"

    depends_on:
      - mysql

    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql/library_db

  mysql:

    image: mysql:8

    container_name: mysql_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: library_db

    ports:
      - "3307:3306"